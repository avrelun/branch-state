[project]
name = "branchstate"
version = "0.1.0"
description = "Branchstate local backend"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2==2.13.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
